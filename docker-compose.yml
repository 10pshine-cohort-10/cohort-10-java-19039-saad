services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job: creates the "cms" database if it does not exist.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    entrypoint: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\"
      -Q \"IF DB_ID('cms') IS NULL CREATE DATABASE cms COLLATE Latin1_General_100_CI_AI_SC_UTF8\""
    profiles: ["init"]

  sonarqube:
    image: sonarqube:community
    container_name: cms-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
    profiles: ["quality"]

volumes:
  sqlserver-data:
  sonarqube-data:
